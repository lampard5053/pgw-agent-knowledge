site_name: PGW Knowledge & Agent Base
site_description: คลังความรู้ + ต้นทางของ Claude Skill สำหรับ Payment Gateway (PGW) — แยกต่างหากจากโปรเจค PaymentGateway หลัก แต่เนื้อหาเกี่ยวเนื่องกัน
theme:
  name: material
  language: en
  font:
    text: Kanit
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: สลับเป็นโหมดสว่าง
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: สลับเป็นโหมดมืด
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - md_in_html

